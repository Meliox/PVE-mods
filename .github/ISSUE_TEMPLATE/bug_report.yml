name: Bug report
description: Report a problem with PVE-mods
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of the problem.
    validations:
      required: true

  - type: input
    id: pve_mods_version
    attributes:
      label: PVE-mods version
      description: >-
        Required. Find it by running `dpkg-query -W -f='${Version}\n' pve-mods`
        on the Proxmox shell.
      placeholder: "For example, 2.1.0"
    validations:
      required: true

  - type: input
    id: pve_version
    attributes:
      label: Proxmox VE version
      description: Find it by running `pveversion -v`.
      placeholder: "For example, 9.0"
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Affected module or feature
      placeholder: "For example, node_info, nag_screen, installer, or upgrade"
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant error messages or logs.
    validations:
      required: true

  - type: textarea
    id: additional_information
    attributes:
      label: Additional information
      description: |
        For `node_info` sensor issues, include relevant `sensors` output.
        For `node_info` issues, enable `mod_debug=1` in the `[debug]` section of `/etc/pve-mods/conf.d/node_info.conf`, restart `pveproxy`, and reproduce the issue to capture diagnostic logs. See the [debug guide](https://github.com/Meliox/PVE-mods/blob/main/src/modules/node_info/readme.md#debug-mode).
        For collector debug-file details, see the [per-collector debug files guide](https://github.com/Meliox/PVE-mods/blob/main/src/modules/node_info/readme.md#per-collector-debug-files).
        Relevant system journal entries may also help. For UI issues, check `journalctl -u pveproxy` around the time the problem occurred and include only relevant entries.
        Add screenshots or other details that may help reproduce the problem.
        Redact passwords, tokens, and other sensitive information before posting logs.
    validations:
      required: false
