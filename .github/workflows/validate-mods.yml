name: Validate Mods

# Called by Test Release Build after a successful .deb build.
# Validates source syntax for all mods, then installs the artifact on a
# Proxmox-seeded runner and verifies that every mod's patches apply and revert cleanly.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  patch-install-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git sudo wget xz-utils dpkg nodejs patch libjson-perl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download deb artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pve-mods-test-build-*
          merge-multiple: true
          path: deb

      - name: Fetch upstream Proxmox files
        run: bash build/test/fetch-proxmox-files.sh

      - name: Install built package
        run: apt-get install -y ./deb/*.deb

      - name: Test package upgrade patch reversion
        run: bash build/test/test-upgrade-revert.sh

      - name: Test Intel GPU permission lifecycle
        run: bash build/test/test-intel-permissions.sh

      - name: Test all mods
        run: bash build/test/test-patches.sh all

      - name: Validate source syntax
        run: bash build/test/test-syntax.sh all 

      - name: Test independent node summary columns
        run: node --test build/test/summary-columns.test.js build/test/ups-details.test.js

      - name: Test storage health parsers
        run: bash build/test/test-storage-health.sh

      - name: Test collector interval configuration and lifecycle
        run: prove build/test/test-intervals.t

      - name: Test AMD GPU support
        run: bash build/test/test-amd.sh

      - name: Test Intel and NVIDIA GPU support
        run: bash build/test/test-gpu.sh

      - name: Test lm-sensors support
        run: bash build/test/test-lm-sensors.sh
