
name: Build APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: apt-signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: main

      - name: Install Debian tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Download release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"

          for channel in stable testing; do
            mkdir -p "$RUNNER_TEMP/packages/$channel"
            prerelease=false
            if [ "$channel" = "testing" ]; then
              prerelease=true
            fi

            jq -r --argjson prerelease "$prerelease" '
              add
              | map(select(.draft == false and .published_at != null))
              | sort_by([.published_at, .id])
              | reverse
              | .[:100]
              | map(select(
                  .prerelease == $prerelease
                  and any(.assets[]?; .name | endswith(".deb"))
                ))
              | .[].tag_name
            ' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/$channel-tags"

            if [ ! -s "$RUNNER_TEMP/$channel-tags" ]; then
              echo "::warning::No published $channel release has Debian packages; generating an empty channel."
              continue
            fi

            while IFS= read -r tag; do
              echo "Downloading $channel packages from $tag"
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern '*.deb' \
                --dir "$RUNNER_TEMP/packages/$channel"
            done < "$RUNNER_TEMP/$channel-tags"
          done

          if ! find "$RUNNER_TEMP/packages" -name '*.deb' -print -quit | grep -q .; then
            echo "::error::No Debian packages found in either channel."
            exit 1
          fi

      - name: Build stable and testing repositories
        run: |
          set -euo pipefail

          rm -rf docs/dists docs/pool docs/changelogs

          mkdir -p docs
          touch docs/.nojekyll
          cd docs

          for channel in stable testing; do
            mkdir -p \
              "dists/$channel/main/binary-amd64" \
              pool/main/p/pve-mods

            shopt -s nullglob
            packages=("$RUNNER_TEMP/packages/$channel/"*.deb)
            if [ "${#packages[@]}" -gt 0 ]; then
              cp "${packages[@]}" pool/main/p/pve-mods/
            fi

            for package in "${packages[@]}"; do
              package_name=$(dpkg-deb --field "$package" Package)
              version=$(dpkg-deb --field "$package" Version)
              version=${version#*:}
              changelog_dir="changelogs/main/${package_name:0:1}/$package_name/${package_name}_$version"
              mkdir -p "$changelog_dir"
              dpkg-deb --fsys-tarfile "$package" \
                | tar -xOf - "./usr/share/doc/$package_name/changelog.gz" \
                | gzip -dc > "$changelog_dir/changelog"
              if [ ! -s "$changelog_dir/changelog" ]; then
                echo "::error::Missing or empty changelog in $package."
                exit 1
              fi
            done

            dpkg-scanpackages --multiversion --arch all pool /dev/null \
              > "dists/$channel/main/binary-amd64/Packages"
            gzip -9 -k "dists/$channel/main/binary-amd64/Packages"

            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="Meliox" \
              -o APT::FTPArchive::Release::Label="PVE-mods" \
              -o APT::FTPArchive::Release::Suite="$channel" \
              -o APT::FTPArchive::Release::Codename="$channel" \
              release "dists/$channel" \
              > "dists/$channel/Release"
            printf '%s\n' \
              'Changelogs: https://pve-mods-apt.meliox.workers.dev/changelogs/@CHANGEPATH@/changelog' \
              >> "dists/$channel/Release"

            # Keep each index isolated; the Worker serves packages from Releases.
            rm -rf pool
          done

      - name: Sign repository metadata
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          : "${APT_GPG_PRIVATE_KEY:?APT_GPG_PRIVATE_KEY secret is required}"
          : "${APT_GPG_KEY_ID:?APT_GPG_KEY_ID secret is required}"
          : "${APT_GPG_PASSPHRASE:?APT_GPG_PASSPHRASE secret is required}"

          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/apt-gnupg.XXXXXX")
          trap 'rm -rf "$GNUPGHOME"' EXIT

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --export-options export-minimal --export "$APT_GPG_KEY_ID" \
            > docs/pve-mods.gpg
          test -s docs/pve-mods.gpg

          for channel in stable testing; do
            release="docs/dists/$channel/Release"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --digest-algo SHA256 --local-user "$APT_GPG_KEY_ID" --clearsign \
              --output "docs/dists/$channel/InRelease" "$release" \
              <<< "$APT_GPG_PASSPHRASE"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --digest-algo SHA256 --local-user "$APT_GPG_KEY_ID" --armor --detach-sign \
              --output "$release.gpg" "$release" \
              <<< "$APT_GPG_PASSPHRASE"

            gpgv --keyring "$GITHUB_WORKSPACE/docs/pve-mods.gpg" \
              "docs/dists/$channel/InRelease"
            gpgv --keyring "$GITHUB_WORKSPACE/docs/pve-mods.gpg" \
              "$release.gpg" "$release"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # 6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # 5.0.0
        with:
          path: docs
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # 5.0.1
