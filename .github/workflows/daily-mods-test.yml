name: Test Mods - Daily

# Daily regression test of pve-mods against the latest upstream Proxmox VE files.
# Mods are auto-discovered from the [modules] section of src/pve-mods.conf and
# tested in parallel - adding a mod needs no change here. If a mod's patches
# fail, an issue is opened (or updated) per failed mod explaining why.
#
# Every run also publishes per-mod results to the compatibility-data branch:
# persistent status JSON, Shields.io endpoint badge JSON (embedded in readme.md)
# and a human-readable report.md. See build/compat-status.mjs.

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover mods from [modules]
        id: list
        run: |
          MODS=$(awk -F= '
            /^\[/ { in_sec = ($0 == "[modules]") }
            in_sec && /^[^#=]+=/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1
            }' src/pve-mods.conf | jq -R . | jq -cs .)
          echo "Discovered mods: $MODS"
          echo "mods=$MODS" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    steps:
      # ── Base tools (mirrors validate-mods.yml) ──────────────────────────────
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git sudo wget xz-utils dpkg nodejs perl gh jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        
      # ── Build (mirrors test-release.yml) ───────────────────────────────────
      - name: Install build deps
        run: |
          apt-get update -qq
          apt-get install -y devscripts debhelper build-essential

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(grep -m1 '(' debian/changelog | sed 's/.*(\(.*\)).*/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION="${BASE_VERSION}+daily.${SHORT_SHA}"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $BUILD_VERSION"

      - name: Inject version into Config.pm
        run: |
          BUILD_VERSION="${{ steps.version.outputs.build_version }}"
          sed -i -E "s/^our \\\$VERSION\s*=.*/our \\\$VERSION = '${BUILD_VERSION}';/" \
            src/modules/node_info/files/Config.pm

      - name: Set package version in changelog
        run: |
          BUILD_VERSION="${{ steps.version.outputs.build_version }}"
          sed -i -E "0,/\(([^)]*)\)/s//(${BUILD_VERSION})/" debian/changelog

      - name: Generate dynamic debian rules
        run: |
          bash build/gen-rules.sh >> debian/rules

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      # ── Test ───────────────────────────────────────────────────────────────
      - name: Fetch upstream Proxmox files
        id: fetch
        env:
          PVE_MODS_PACKAGE_DIR: ${{ runner.temp }}/proxmox-packages
        run: bash build/test/fetch-proxmox-files.sh

      - name: Capture patch target package versions
        id: packages
        env:
          MOD: ${{ matrix.mod }}
        run: |
          bash build/test/report-patch-packages.sh \
            "src/modules/$MOD/patches" "$RUNNER_TEMP/proxmox-packages" \
            > "$RUNNER_TEMP/patch-packages.md"
          bash build/test/report-patch-packages.sh \
            "src/modules/$MOD/patches" "$RUNNER_TEMP/proxmox-packages" json \
            > "$RUNNER_TEMP/patch-packages.json"
          cat "$RUNNER_TEMP/patch-packages.md"

      - name: Install built package
        id: install
        run: apt-get install -y ../pve-mods_*.deb

      - name: Test mod
        id: test
        run: |
          set -o pipefail
          bash build/test/test-patches.sh "${{ matrix.mod }}" 2>&1 | tee test-output.log

      - name: Validate source syntax
        id: syntax
        run: bash build/test/test-syntax.sh "${{ matrix.mod }}"

      # Distinguish patch/syntax failures ("fail") from runs that could not
      # complete, e.g. a package download outage ("unavailable").
      - name: Record result for compatibility report
        if: always()
        shell: bash
        env:
          MOD: ${{ matrix.mod }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$TEST_OUTCOME" == "success" && "$SYNTAX_OUTCOME" == "success" ]]; then
            STATUS=pass
          elif [[ "$TEST_OUTCOME" == "failure" || "$SYNTAX_OUTCOME" == "failure" ]]; then
            STATUS=fail
          else
            STATUS=unavailable
          fi
          PACKAGES='{}'
          if [[ -s "$RUNNER_TEMP/patch-packages.json" ]]; then
            PACKAGES=$(cat "$RUNNER_TEMP/patch-packages.json")
          fi
          mkdir -p results
          jq -n \
            --arg mod "$MOD" \
            --arg status "$STATUS" \
            --argjson packages "$PACKAGES" \
            --arg version "$BUILD_VERSION" \
            --arg run_url "$RUN_URL" \
            --arg date "$(date -u +%F)" \
            '{mod: $mod, status: $status, packages: $packages,
              pve_mods_version: $version, run_url: $run_url, date: $date}' \
            > "results/$MOD.json"
          cat "results/$MOD.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.mod }}
          path: results/

      - name: Report failure as issue
        if: always() && (steps.test.outcome == 'failure' || steps.syntax.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD: ${{ matrix.mod }}
        run: |
          TITLE="[patch-break] ${MOD}"
          {
            echo "The daily mods test failed for mod \`${MOD}\` against the latest Proxmox VE files."
            echo ""
            echo "**Patch target packages:**"
            if [[ -s "$RUNNER_TEMP/patch-packages.md" ]]; then
              cat "$RUNNER_TEMP/patch-packages.md"
            else
              echo "Package information was not captured; see the workflow run."
            fi
            echo ""            
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "<details><summary>Test log</summary>"
            echo ""
            echo '```'
            tail -n 200 test-output.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            echo "</details>"
          } > issue-body.md

          # Ensure the label exists (no-op if it already does).
          gh label create patch-break --color B60205 \
            --description "pve-mods patch failed against upstream Proxmox" 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label patch-break \
            --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh issue edit "$EXISTING" --body-file issue-body.md
            gh issue comment "$EXISTING" --body-file issue-body.md
            echo "Updated and commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --label patch-break --body-file issue-body.md
            echo "Opened new issue for mod $MOD"
          fi

  # Aggregate the per-mod results into the compatibility-data branch: status
  # JSON, Shields.io badge JSON (embedded in readme.md) and report.md.
  report:
    needs: [discover, test]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: compatibility-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Update compatibility-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/compatibility-data"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch compatibility-data "$REMOTE" "$DATA_DIR" 2>/dev/null; then
            echo "Checked out existing compatibility-data branch"
          else
            echo "Creating orphan compatibility-data branch"
            mkdir -p "$DATA_DIR"
            git -C "$DATA_DIR" init -b compatibility-data
            git -C "$DATA_DIR" remote add origin "$REMOTE"
          fi

          mkdir -p results
          node build/compat-status.mjs --results results --data "$DATA_DIR"

          cd "$DATA_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update compatibility data for $(date -u +%F)"
          git push origin compatibility-data