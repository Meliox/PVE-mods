# pve-mods :: upgrade_access mod configuration
# Each feature is an independent patch; enable it with the flag and list the
# Proxmox groups (comma separated, e.g. an OIDC-synced group) that may use it.
# Members additionally need Sys.Console on /nodes/<node>. An empty group list
# keeps stock behaviour even when the patch is applied.
[access]
# Upgrade console (Updates -> Upgrade, runs 'pveupgrade --shell' as root).
upgrade=0
upgrade_groups=
# Node "Shell" tab without login prompt (passwordless ROOT shell).
shell=0
shell_groups=
