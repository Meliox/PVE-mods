# pve-mods :: node_info mod configuration
# Settings for the node-info / sensor-monitoring mod.
# Managed by pve-mods-configure. Re-run to update.
# After editing this file manually, restart pveproxy (systemctl restart pveproxy).

[gpu]
intel_enabled=0
nvidia_enabled=0
amd_enabled=0
# 0 = GPU graphs use live data only, 1 = record history to RRD (runs the GPU
# collectors around the clock, which uses CPU even when the UI is closed).
# Each GPU graph groups metrics by unit; use its menu to switch groups and its
# legend to show or hide series. Node summary charts show their titles above
# the legend; long titles wrap and can also be viewed by hovering over them.
gpu_history=0

[lm_sensors]
enabled=0
enable_cpu=0
enable_ram_temp=0
enable_hdd_temp=0
enable_nvme_temp=0
enable_fan_speed=0
display_zero_speed_fans=0

[ups]
enabled=0
device_name=ups@localhost

[system_info]
enabled=0
type=1
temp_unit=C
ignore_temp_below=5

# Storage health: one summary row on the node Summary covering ZFS pool state
# (degraded, removed/faulted drives, resilver/scrub, data errors) and SMART drive
# health (failure, FAILING_NOW attributes, NVMe critical warnings, SSD life).
# SMART needs root, so a systemd service (pve-mods-storage-smart) queries the
# drives; it is installed/removed together with this setting.
[storage_health]
enabled=0
# 0 = ZFS pool checks only
smart_enabled=1
# Remaining SSD/NVMe life (percent) at or below which a warning / critical is shown
life_warning_percent=20
life_critical_percent=10
# Seconds between 'zpool status' runs while the node Summary is open
zfs_interval=15
# Seconds between SMART queries of a drive that is already spinning
smart_interval=1800
# 0 = never wake a sleeping drive: it keeps its last SMART result and is
# skipped until it spins up on its own. 1 = query it regardless.
smart_wake_disks=0

[intervals]
# Seconds between collector data polls
data_pull=1
# Seconds without a request before collectors stop. Keep above the polling
# interval of external clients (e.g. Home Assistant).
collector_timeout=10

# Debug mode: when a collector's mode is 1, the real tool is not required.
# Data is read from the file path instead. Useful for development/testing.
# Note: debug settings are only read at pveproxy startup — restart pveproxy
# after changing them. Debug output goes to the journal (journalctl -u pveproxy),
# plus log_file if log_enabled=1.
[debug]
mod_debug=0
lm_sensors_mode=0
lm_sensors_output_file=/tmp/sensors-output.json
intel_mode=0
intel_devices_file=/tmp/intel-gpu-devices.json
intel_output_file=/tmp/intel-gpu-output.txt
nvidia_mode=0
nvidia_devices_file=/tmp/nvidia-smi-devices.csv
nvidia_output_file=/tmp/nvidia-smi-output.csv
amd_mode=0
amd_devices_file=/tmp/amd-gpu-devices.json
ups_mode=0
ups_output_file=/tmp/ups-output.json
storage_health_mode=0
zpool_output_file=/tmp/zpool-status.txt
smartctl_output_file=/tmp/smartctl-output.json
log_enabled=0
log_file=/tmp/pve-mods-debug.log
