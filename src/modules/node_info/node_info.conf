# pve-mod :: node_info mod configuration
# Settings for the node-info / sensor-monitoring mod.
# Managed by pve-mod-configure. Re-run to update.

[gpu]
intel_enabled=0
nvidia_enabled=0
amd_enabled=0
gpu_history=0

[lm_sensors]
enabled=0
enable_cpu=0
cpu_temp_target=Core
enable_ram_temp=0
enable_hdd_temp=0
enable_nvme_temp=0
enable_fan_speed=0
display_zero_speed_fans=0

[ups]
enabled=0
device_name=ups@localhost

[system_info]
enabled=0
type=1
temp_unit=C
ignore_temp_below=5

# Debug mode: when a collector's mode is 1, the real tool is not required.
# Data is read from the file path instead. Useful for development/testing.
# Note: debug settings are only read at pveproxy startup — restart pveproxy
# after changing them. Debug output goes to the journal (journalctl -u pveproxy),
# plus log_file if log_enabled=1.
[debug]
mod_debug=0
lm_sensors_mode=0
lm_sensors_output_file=/tmp/sensors-output.json
intel_mode=0
intel_devices_file=/tmp/intel-gpu-devices.json
intel_output_file=/tmp/intel-gpu-output.txt
nvidia_mode=0
nvidia_devices_file=/tmp/nvidia-smi-devices.csv
nvidia_output_file=/tmp/nvidia-smi-output.csv
amd_mode=0
amd_devices_file=/tmp/amd-gpu-devices.json
ups_mode=0
ups_output_file=/tmp/ups-output.json
log_enabled=0
log_file=/tmp/pve-mod-debug.log
